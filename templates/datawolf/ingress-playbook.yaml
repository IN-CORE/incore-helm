{{- if and .Values.datawolfplaybook.enabled .Values.ingress.enabled -}}
{{- $fullName := .Values.datawolfplaybook.fullnameOverride -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "incore.fullname" . }}-datawolf-playbook
  labels:
    {{- include "incore.labels" . | nindent 4 }}
  annotations:
    {{- include "incore.authIngressAnnotation" . | nindent 4 }}
    {{- with .Values.datawolfplaybook.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.datawolfplaybook.contextPath }}/
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
    {{- end }}
{{- end }}
